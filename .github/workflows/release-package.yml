name: Stage 1 release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version embedded in the package name and executable identity"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 UCRT64 package
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the native UCRT64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            file
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pytest

      - name: Build and test the native Windows artifact
        shell: msys2 {0}
        env:
          # Keep the release flags owned by the repository Makefile/CMakeLists.
          CFLAGS: ""
          CPPFLAGS: ""
          LDFLAGS: ""
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          native_cc="$(cygpath -m "$(command -v gcc)")"
          native_python="$(cygpath -m "$(command -v python)")"
          native_make="$(cygpath -m "$(command -v mingw32-make)")"
          gcc --version
          python -c "import sys, pytest; assert sys.platform == 'win32'; assert sys.version_info >= (3, 10); print(sys.executable, pytest.__version__)"

          mingw32-make OS=Windows_NT CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= build
          python tools/release_smoke.py --version "$RELEASE_VERSION" --executable "$(cygpath -m "$PWD/aphelion.exe")"
          mingw32-make OS=Windows_NT CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= test

          cmake -S . -B "build-release" -G "MinGW Makefiles" \
            "-DCMAKE_C_COMPILER=$native_cc" "-DCMAKE_MAKE_PROGRAM=$native_make" \
            "-DPython3_EXECUTABLE=$native_python" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "build-release" --config Release --parallel
          python tools/release_smoke.py --version "$RELEASE_VERSION" --executable "$(cygpath -m "$PWD/build-release/aphelion.exe")"
          ctest --test-dir "build-release" -C Release --output-on-failure --no-tests=error

      - name: Check PE x64 identity and runtime imports
        shell: msys2 {0}
        run: |
          set -euo pipefail
          identity="$(file -b aphelion.exe)"
          printf 'aphelion.exe: %s\n' "$identity"
          case "$identity" in
            *PE32+*x86-64*) ;;
            *) printf 'unexpected native identity: %s\n' "$identity" >&2; exit 1 ;;
          esac
          objdump -p aphelion.exe | tee "$RUNNER_TEMP/aphelion-windows-imports.txt"
          python - <<'PY'
          from pathlib import Path

          report = Path(__import__("os").environ["RUNNER_TEMP"]) / "aphelion-windows-imports.txt"
          text = report.read_text(encoding="utf-8", errors="replace").lower()
          if "pei-x86-64" not in text:
              raise SystemExit("PE import report does not identify an x86-64 image")
          forbidden = ("msys-2.0.dll", "cygwin1.dll")
          found = [name for name in forbidden if name in text]
          if found:
              raise SystemExit("non-native runtime imports found: " + ", ".join(found))
          print("Windows runtime imports contain no MSYS/Cygwin runtime")
          PY

      - name: Create the Windows archive and checksum
        shell: msys2 {0}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          project_root="$(cygpath -m "$PWD")"
          executable="$(cygpath -m "$PWD/aphelion.exe")"
          output="$(cygpath -m "$PWD/dist/aphelion-${RELEASE_VERSION}-windows.zip")"
          python tools/release_package.py windows \
            --version "$RELEASE_VERSION" \
            --executable "$executable" \
            --output "$output" \
            --project-root "$project_root" \
            --force
          test -f "dist/aphelion-${RELEASE_VERSION}-windows.zip"
          test -f "dist/aphelion-${RELEASE_VERSION}-windows.zip.sha256"
          python tools/verify_release_archive.py windows \
            --archive "$(cygpath -m "$PWD/dist/aphelion-${RELEASE_VERSION}-windows.zip")" \
            --version "$RELEASE_VERSION"

      - name: Upload the Windows Actions artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aphelion-${{ inputs.version }}-windows-x64-ucrt64
          if-no-files-found: error
          path: |
            dist/aphelion-${{ inputs.version }}-windows.zip
            dist/aphelion-${{ inputs.version }}-windows.zip.sha256

  linux:
    name: Linux x64 glibc 2.35 package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the native inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            binutils build-essential cmake file

      - name: Set up Python and pytest
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Build and test the native Linux artifact
        env:
          # Keep the release flags owned by the repository Makefile/CMakeLists.
          CFLAGS: ""
          CPPFLAGS: ""
          LDFLAGS: ""
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gcc --version
          make CC=gcc PYTHON=python CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= build
          python tools/release_smoke.py --version "$RELEASE_VERSION" --executable "$PWD/aphelion"
          make CC=gcc PYTHON=python CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= test

          cmake -S . -B build-release -DCMAKE_C_COMPILER=gcc \
            "-DPython3_EXECUTABLE=$(command -v python)" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-release --config Release --parallel
          python tools/release_smoke.py --version "$RELEASE_VERSION" --executable "$PWD/build-release/aphelion"
          ctest --test-dir build-release -C Release --output-on-failure --no-tests=error

      - name: Check ELF x64 identity, dependencies, and glibc baseline
        run: |
          set -euo pipefail
          identity="$(file -b aphelion)"
          printf 'aphelion: %s\n' "$identity"
          case "$identity" in
            *ELF*64-bit*x86-64*) ;;
            *) printf 'unexpected native identity: %s\n' "$identity" >&2; exit 1 ;;
          esac
          ldd aphelion | tee "$RUNNER_TEMP/aphelion-linux-dependencies.txt"
          objdump -T aphelion | tee "$RUNNER_TEMP/aphelion-linux-symbols.txt"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          dependencies = (Path(os.environ["RUNNER_TEMP"]) / "aphelion-linux-dependencies.txt").read_text()
          if "not found" in dependencies:
              raise SystemExit("ldd reported an unresolved Linux runtime dependency")
          symbols = (Path(os.environ["RUNNER_TEMP"]) / "aphelion-linux-symbols.txt").read_text()
          versions = [tuple(map(int, match)) for match in re.findall(r"GLIBC_(\d+)\.(\d+)", symbols)]
          if versions and max(versions) > (2, 35):
              raise SystemExit(f"binary requires newer than documented glibc 2.35: {max(versions)}")
          print(f"Linux runtime dependencies resolved; highest GLIBC symbol: {max(versions, default=(0, 0))}")
          PY

      - name: Create the Linux archive and checksum
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/release_package.py linux \
            --version "$RELEASE_VERSION" \
            --executable "$PWD/aphelion" \
            --output "$PWD/dist/aphelion-${RELEASE_VERSION}-linux.tar.gz" \
            --project-root "$PWD" \
            --force
          test -f "dist/aphelion-${RELEASE_VERSION}-linux.tar.gz"
          test -f "dist/aphelion-${RELEASE_VERSION}-linux.tar.gz.sha256"
          python tools/verify_release_archive.py linux \
            --archive "$PWD/dist/aphelion-${RELEASE_VERSION}-linux.tar.gz" \
            --version "$RELEASE_VERSION"

      - name: Upload the Linux Actions artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aphelion-${{ inputs.version }}-linux-x64-glibc235
          if-no-files-found: error
          path: |
            dist/aphelion-${{ inputs.version }}-linux.tar.gz
            dist/aphelion-${{ inputs.version }}-linux.tar.gz.sha256

  windows-clean-install:
    name: Windows package smoke without development PATH
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Download the packaged Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aphelion-${{ inputs.version }}-windows-x64-ucrt64
          path: downloaded

      - name: Verify and run the extracted Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Get-ChildItem downloaded -Filter "*.zip" | Select-Object -First 1
          if ($null -eq $archive) { throw "Windows package archive was not downloaded" }
           $sidecar = Get-Content "$($archive.FullName).sha256" -Raw
           $expected = ($sidecar -split "\s+")[0].ToLowerInvariant()
           $actual = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
           if ($expected -ne $actual) { throw "Windows archive checksum mismatch" }
           function Read-ZipEntryText($entry) {
             $stream = $entry.Open()
             try {
               $reader = [System.IO.StreamReader]::new($stream, [System.Text.Encoding]::UTF8, $true)
               try { return $reader.ReadToEnd() }
               finally { $reader.Dispose() }
             }
             finally { $stream.Dispose() }
           }
           Add-Type -AssemblyName System.IO.Compression.FileSystem
           $rootName = "aphelion-${{ inputs.version }}-windows"
           $rootPrefix = "$rootName/"
           $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
           try {
             $entries = @($zip.Entries)
             if ($entries.Count -eq 0) { throw "Windows package archive is empty" }
             $names = @()
             $manifestEntry = $null
             $checksumsEntry = $null
             foreach ($entry in $entries) {
               $name = $entry.FullName
               if ([string]::IsNullOrWhiteSpace($name) -or $name.Contains('\') -or
                   $name.StartsWith('/') -or $name -match '^[A-Za-z]:' -or
                   $name -match '[\x00]') {
                 throw "Windows package has an unsafe archive member path: $name"
               }
               $parts = $name -split '/'
               if (($parts | Where-Object { $_ -eq '' -or $_ -eq '.' -or $_ -eq '..' }).Count -gt 0) {
                 throw "Windows package has an unsafe archive member path: $name"
               }
               if ($parts.Count -lt 2 -or $parts[0] -cne $rootName) {
                 throw "Windows package has an unexpected top-level root: $name"
               }
               $attributes = [uint32]$entry.ExternalAttributes
               $unixType = ($attributes -shr 16) -band 0xF000
               $dosDirectory = ($attributes -band 0x0010) -ne 0
               $unixDirectory = $unixType -eq 0x4000
               if ($entry.Name -eq '' -or $dosDirectory -or $unixDirectory) {
                 throw "Windows package contains a directory member: $name"
               }
               if ($unixType -eq 0xA000 -or ($attributes -band 0x0400) -ne 0) {
                 throw "Windows package contains a symlink member: $name"
               }
               if ($names -contains $name) { throw "Windows package contains a duplicate member: $name" }
               $names += $name
               if ($name -ceq "${rootPrefix}manifest.json") { $manifestEntry = $entry }
               if ($name -ceq "${rootPrefix}SHA256SUMS") { $checksumsEntry = $entry }
             }
             if ($null -eq $manifestEntry -or $null -eq $checksumsEntry) {
               throw "Windows package is missing manifest.json or SHA256SUMS"
             }
             try { $manifest = Read-ZipEntryText $manifestEntry | ConvertFrom-Json }
             catch { throw "Windows package manifest.json is not valid JSON: $($_.Exception.Message)" }
              if ($manifest.product -ne 'aphelion' -or $manifest.version -ne '${{ inputs.version }}' -or
                  $manifest.platform -ne 'windows' -or
                  $manifest.executable -ne 'aphelion.exe' -or $manifest.checksums -ne 'SHA256SUMS' -or
                  $null -eq $manifest.files) {
               throw "Windows package manifest has unexpected metadata"
             }
             $expectedNames = @("${rootPrefix}manifest.json", "${rootPrefix}SHA256SUMS")
             foreach ($file in @($manifest.files)) {
               $relative = [string]$file.path
               if ([string]::IsNullOrWhiteSpace($relative) -or $relative.Contains('\') -or
                   $relative.StartsWith('/') -or $relative -match '^[A-Za-z]:') {
                 throw "Windows package manifest has an unsafe member path: $relative"
               }
               $relativeParts = $relative -split '/'
               if (($relativeParts | Where-Object { $_ -eq '' -or $_ -eq '.' -or $_ -eq '..' }).Count -gt 0) {
                 throw "Windows package manifest has an unsafe member path: $relative"
               }
                if ($relative -ne 'aphelion.exe' -and $relative -ne 'LICENSE' -and
                    $relative -notmatch '^examples/.+\.agne$' -and
                    $relative -notmatch '^[^/]+\.dll$') {
                 throw "Windows package manifest has an unexpected member: $relative"
               }
               $fullName = "$rootPrefix$relative"
               if ($expectedNames -contains $fullName) {
                 throw "Windows package manifest has a duplicate member: $relative"
               }
                $expectedNames += $fullName
              }
              if (($rootPrefix + "LICENSE") -notin $expectedNames) {
                throw "Windows package manifest is missing LICENSE"
              }
             if (@($expectedNames | Sort-Object -Unique).Count -ne $expectedNames.Count) {
               throw "Windows package manifest has duplicate members"
             }
             $unexpected = @($names | Where-Object { $_ -notin $expectedNames })
             $missing = @($expectedNames | Where-Object { $_ -notin $names })
             if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
               throw "Windows package has unexpected or missing members (unexpected: $($unexpected -join ', '); missing: $($missing -join ', '))"
             }
             $checksumText = Read-ZipEntryText $checksumsEntry
             $checksumLines = @($checksumText -split "`r?`n" | Where-Object { $_ -ne '' })
             $checksumNames = @()
             foreach ($line in $checksumLines) {
               if ($line -notmatch '^(?<hash>[0-9A-Fa-f]{64})  (?<path>.+)$') {
                 throw "Malformed Windows package checksum line: $line"
               }
               $relative = $Matches['path']
               $relativeParts = $relative -split '/'
               if ($relative.Contains('\') -or $relative.StartsWith('/') -or $relative -match '^[A-Za-z]:' -or
                   ($relativeParts | Where-Object { $_ -eq '' -or $_ -eq '.' -or $_ -eq '..' }).Count -gt 0) {
                 throw "Windows package checksum has an unsafe member path: $relative"
               }
               $fullName = "$rootPrefix$relative"
               if ($fullName -eq "${rootPrefix}SHA256SUMS" -or $fullName -notin $expectedNames -or
                   $checksumNames -contains $fullName) {
                 throw "Windows package checksum lists an unexpected or duplicate member: $relative"
               }
               $checksumNames += $fullName
             }
             $expectedChecksumNames = @($expectedNames | Where-Object { $_ -ne "${rootPrefix}SHA256SUMS" })
             $actualChecksumSet = @($checksumNames | Sort-Object -Unique) -join "`n"
             $expectedChecksumSet = @($expectedChecksumNames | Sort-Object -Unique) -join "`n"
             if ($actualChecksumSet -ne $expectedChecksumSet) {
               throw "Windows package SHA256SUMS does not cover exactly the archive payload"
             }
           }
           finally { $zip.Dispose() }
           $install = Join-Path $PWD "installed"
           Expand-Archive -LiteralPath $archive.FullName -DestinationPath $install
           $rootPath = Join-Path $install $rootName
           if (-not (Test-Path -LiteralPath $rootPath -PathType Container)) {
             throw "Windows package has no expected top-level directory"
           }
           $root = Get-Item -LiteralPath $rootPath
          foreach ($line in Get-Content (Join-Path $root.FullName "SHA256SUMS")) {
            $parts = $line -split "\s+", 2
            if ($parts.Count -ne 2) { throw "Malformed Windows package checksum line: $line" }
            $member = Join-Path $root.FullName $parts[1]
            $actualMember = (Get-FileHash $member -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualMember -ne $parts[0].ToLowerInvariant()) {
              throw "Windows package member checksum mismatch: $($parts[1])"
            }
          }
          $exe = Join-Path $root.FullName "aphelion.exe"
          $env:Path = "$($root.FullName);$env:SystemRoot\System32;$env:SystemRoot"
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "aphelion ${{ inputs.version }}") {
            throw "packaged Windows version check failed: $version"
          }
          $hello = (& $exe run (Join-Path $root.FullName "examples\hello.agne") 2>&1 | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or $hello -ne "Welcome Aswin`r`nFinal score: 100") {
            throw "packaged Windows hello example failed: $hello"
          }
          $modules = (& $exe run (Join-Path $root.FullName "examples\modules.agne") 2>&1 | Out-String).TrimEnd()
          if ($LASTEXITCODE -ne 0 -or $modules -ne "module initialized`r`n42") {
            throw "packaged Windows module example failed: $modules"
          }
          Write-Host "Windows package executed with a sanitized PATH and no development toolchain"

  linux-clean-install:
    name: Linux package smoke without development PATH
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download the packaged Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aphelion-${{ inputs.version }}-linux-x64-glibc235
          path: downloaded

      - name: Verify and run the extracted Linux package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find downloaded -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$archive").sha256")
          python - "$archive" "aphelion-${{ inputs.version }}-linux" <<'PY'
          import json
          import re
          import sys
          import tarfile

          archive_name, root_name = sys.argv[1:]
          root_prefix = root_name + "/"

          def fail(message):
              raise SystemExit(message)

          def safe_relative(value, label):
              if (not isinstance(value, str) or not value or value.startswith(("/", "\\"))
                      or "\\" in value or re.match(r"^[A-Za-z]:", value)
                      or any(part in ("", ".", "..") for part in value.split("/"))):
                  fail(f"{label} has an unsafe member path: {value!r}")
              return value

          with tarfile.open(archive_name, "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  fail("Linux package archive is empty")
              names = []
              contents = {}
              for member in members:
                  name = member.name
                  if "\x00" in name:
                      fail("Linux package has an unsafe archive member path")
                  safe_relative(name, "Linux package archive member")
                  if name.split("/", 1)[0] != root_name:
                      fail(f"Linux package has an unexpected top-level root: {name}")
                  if member.issym() or member.islnk():
                      fail(f"Linux package contains a symlink member: {name}")
                  if not member.isfile():
                      fail(f"Linux package contains a non-file member: {name}")
                  if name in names:
                      fail(f"Linux package contains a duplicate member: {name}")
                  names.append(name)
                  stream = archive.extractfile(member)
                  if stream is None:
                      fail(f"Linux package member cannot be read: {name}")
                  contents[name] = stream.read()

              manifest_name = root_prefix + "manifest.json"
              checksums_name = root_prefix + "SHA256SUMS"
              if manifest_name not in contents or checksums_name not in contents:
                  fail("Linux package is missing manifest.json or SHA256SUMS")
              try:
                  manifest = json.loads(contents[manifest_name].decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"Linux package manifest.json is not valid JSON: {error}")
              if (manifest.get("product") != "aphelion"
                      or manifest.get("version") != "${{ inputs.version }}"
                      or manifest.get("platform") != "linux"
                      or manifest.get("executable") != "aphelion"
                      or manifest.get("checksums") != "SHA256SUMS"
                      or not isinstance(manifest.get("files"), list)):
                  fail("Linux package manifest has unexpected metadata")
              expected = {manifest_name, checksums_name}
              for item in manifest["files"]:
                  if not isinstance(item, dict):
                      fail("Linux package manifest has an invalid file entry")
                  relative = safe_relative(item.get("path"), "Linux package manifest")
                  if relative not in ("aphelion", "LICENSE") and not re.fullmatch(r"examples/.+\.agne", relative):
                      fail(f"Linux package manifest has an unexpected member: {relative}")
                  full_name = root_prefix + relative
                  if full_name in expected:
                      fail(f"Linux package manifest has a duplicate member: {relative}")
                  expected.add(full_name)
              if root_prefix + "LICENSE" not in expected:
                  fail("Linux package manifest is missing LICENSE")
              actual = set(names)
              if actual != expected:
                  fail("Linux package has unexpected or missing archive members")

              checksum_names = []
              try:
                  checksum_lines = contents[checksums_name].decode("ascii").splitlines()
              except UnicodeDecodeError as error:
                  fail(f"Linux package SHA256SUMS is not ASCII: {error}")
              for line in checksum_lines:
                  match = re.fullmatch(r"([0-9A-Fa-f]{64})  (.+)", line)
                  if match is None:
                      fail(f"Malformed Linux package checksum line: {line}")
                  relative = safe_relative(match.group(2), "Linux package checksum")
                  full_name = root_prefix + relative
                  if (full_name == checksums_name or full_name not in expected
                          or full_name in checksum_names):
                      fail(f"Linux package checksum lists an unexpected or duplicate member: {relative}")
                  checksum_names.append(full_name)
              if set(checksum_names) != expected - {checksums_name}:
                  fail("Linux package SHA256SUMS does not cover exactly the archive payload")
          PY
          install="$PWD/installed"
          mkdir -p "$install"
          tar -xzf "$archive" -C "$install"
          root="$install/aphelion-${{ inputs.version }}-linux"
          test -d "$root"
          (cd "$root" && sha256sum -c SHA256SUMS)
          version="$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$root/aphelion" --version)"
          test "$version" = "aphelion ${{ inputs.version }}"
          hello="$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$root/aphelion" run "$root/examples/hello.agne")"
          test "$hello" = $'Welcome Aswin\nFinal score: 100'
          modules="$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$root/aphelion" run "$root/examples/modules.agne")"
          test "$modules" = $'module initialized\n42'
          echo "Linux package executed with a sanitized PATH and no development toolchain"
