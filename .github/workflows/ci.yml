name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mingw:
    name: Windows MinGW C11 and regression tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            file
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pytest
      - name: Strict native UCRT64 Make and CMake release gates
        shell: msys2 {0}
        env:
          # CI owns the complete flag set below. Do not let runner-wide
          # CFLAGS/CPPFLAGS/LDFLAGS values arrive as one quoted argument.
          CFLAGS: ""
          CPPFLAGS: ""
          LDFLAGS: ""
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          native_cc="$(cygpath -m "$(command -v gcc)")"
          native_python="$(cygpath -m "$(command -v python)")"
          native_make="$(cygpath -m "$(command -v mingw32-make)")"
          gcc --version
          python -c "import sys, pytest; assert sys.platform == 'win32'; assert sys.version_info >= (3, 10); print(sys.executable, pytest.__version__)"
          mingw32-make OS=Windows_NT CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= build
          python tools/release_smoke.py --executable "$(cygpath -m "$PWD/aphelion.exe")"
          mingw32-make OS=Windows_NT CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS= LDFLAGS= test
          ./aphelion.exe run examples/hello.agne
          cmake -S . -B "build Release" -G "MinGW Makefiles" \
            "-DCMAKE_C_COMPILER=$native_cc" "-DCMAKE_MAKE_PROGRAM=$native_make" \
            "-DPython3_EXECUTABLE=$native_python" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "build Release" --config Release --parallel
          python tools/release_smoke.py --executable "$(cygpath -m "$PWD/build Release/aphelion.exe")"
          for binary in aphelion.exe "build Release/aphelion.exe"; do
            file "$binary"
            python -c "import subprocess, sys; data = subprocess.check_output(['objdump', '-p', sys.argv[1]], text=True).lower(); assert 'pei-x86-64' in data, data; assert not any(dll in data for dll in ('msys-2.0.dll', 'cygwin1.dll')), data" "$binary"
          done
          ctest --test-dir "build Release" -C Release --output-on-failure --no-tests=error

  macos:
    name: Native macOS Clang C11 and regression tests
    # Keep this native SDK gate on a fixed Intel macOS image. The rolling
    # macos-latest label selected an arm64 runner where the native SDK/build
    # gate failed; the supported release targets are not macOS.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install GNU make
        run: brew install make
      - name: Strict native Clang Make and CMake release gates
        shell: bash
        env:
          # CI owns the complete flag set below. Do not let runner-wide
          # CFLAGS/CPPFLAGS/LDFLAGS values arrive as one quoted argument.
          CFLAGS: ""
          CPPFLAGS: ""
          LDFLAGS: ""
        run: |
          set -euo pipefail
          xcode-select -p
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdkroot"
          native_cc="$(xcrun --sdk macosx --find clang)"
          native_python="$(command -v python)"
          "$native_cc" --version
          printf '#include <stdlib.h>\n' | "$native_cc" -isysroot "$sdkroot" -std=c11 -x c - -fsyntax-only
          export SDKROOT="$sdkroot"
          gmake CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS="-isysroot $sdkroot" LDFLAGS="-isysroot $sdkroot" build
          python tools/release_smoke.py --executable "$PWD/aphelion"
          gmake CC="$native_cc" PYTHON="$native_python" \
            CPPFLAGS=-Iinclude CFLAGS="-isysroot $sdkroot" LDFLAGS="-isysroot $sdkroot" test
          ./aphelion run examples/hello.agne
          cmake -S . -B "build Release" "-DCMAKE_C_COMPILER=$native_cc" \
            "-DCMAKE_OSX_SYSROOT=$sdkroot" \
            "-DPython3_EXECUTABLE=$native_python" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "build Release" --config Release --parallel
          python tools/release_smoke.py --executable "$PWD/build Release/aphelion"
          for binary in aphelion "build Release/aphelion"; do
            identity="$(file -b "$binary")"
            printf '%s: %s\n' "$binary" "$identity"
            case "$identity" in *Mach-O*) ;; *) exit 1 ;; esac
          done
          ctest --test-dir "build Release" -C Release --output-on-failure --no-tests=error

  build-test:
    name: Strict GCC, pytest, and CLI smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Build with strict GCC
        run: |
          gcc --version
          make CC=gcc build
          file aphelion
          case "$(file -b aphelion)" in *ELF*) ;; *) exit 1 ;; esac

      - name: Run pytest
        env:
          APHELION_TEST_EXECUTABLE: ${{ github.workspace }}/aphelion
          CC: gcc
        run: python -m pytest -q

      - name: Run portable release smoke
        run: python tools/release_smoke.py --executable "$PWD/aphelion"

      - name: Configure and test with CMake
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=gcc \
            "-DPython3_EXECUTABLE=$(command -v python)" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          python tools/release_smoke.py --executable "$PWD/build/aphelion"
          file build/aphelion
          case "$(file -b build/aphelion)" in *ELF*) ;; *) exit 1 ;; esac
          ctest --test-dir build -C Release --output-on-failure --no-tests=error

  sanitizer:
    name: GCC sanitizers (Linux toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: gcc
      APHELION_TEST_EXECUTABLE: ${{ github.workspace }}/aphelion-sanitize
      APHELION_TEST_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Build the sanitizer target
        run: |
          gcc --version
          # This deliberately fails if this toolchain lacks sanitizer runtimes.
          make CC=gcc OS= sanitize
          file aphelion-sanitize
          case "$(file -b aphelion-sanitize)" in *ELF*) ;; *) exit 1 ;; esac

      - name: Run the full pytest suite under sanitizers
        run: python -m pytest -q

      - name: Run bounded sanitized source harness
        run: >-
          python tools/fuzz_harness.py source
          --executable "$APHELION_TEST_EXECUTABLE"
          --cases 64 --seed 2026 --timeout 5
          --max-case-bytes 65536 --max-total-bytes 1048576
          --report "$RUNNER_TEMP/aphelion-source-fuzz.json"

      - name: Run bounded sanitized bytecode harness
        run: >-
          python tools/fuzz_harness.py bytecode
          --executable "$APHELION_TEST_EXECUTABLE"
          --cases 64 --seed 2026 --timeout 5
          --max-case-bytes 65536 --max-total-bytes 1048576
          --report "$RUNNER_TEMP/aphelion-bytecode-fuzz.json"

      - name: Reject sanitizer diagnostics in harness reports
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Sanitizers can exit with status 1, which malformed inputs also use.
          # Do not let an expected-error classification mask a sanitizer report.
          markers = ("AddressSanitizer", "LeakSanitizer", "UndefinedBehaviorSanitizer", "runtime error:")
          for mode in ("source", "bytecode"):
              path = Path(os.environ["RUNNER_TEMP"]) / f"aphelion-{mode}-fuzz.json"
              report = json.loads(path.read_text(encoding="utf-8"))
              findings = [
                  case for case in report["cases"]
                  if any(marker in case.get("stderr", "") for marker in markers)
              ]
              if findings:
                  raise SystemExit(json.dumps(findings, indent=2))
              if not report["passed"] or report["executed_cases"] != 64:
                  raise SystemExit(f"{mode}: harness failed or did not execute all 64 cases")
              print(f"{mode}: 64 cases passed without sanitizer diagnostics")
          PY
